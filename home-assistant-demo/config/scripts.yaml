iw3ip_publish_demo_temperature:
  alias: IW3IP Publish Demo Temperature
  mode: single
  sequence:
    - action: mqtt.publish
      data:
        topic: homeassistant/state/sensor/temperature
        payload: >-
          {{ {
            "entity_id": "sensor.demo_temperature",
            "state": "24.5",
            "attributes": {"unit_of_measurement": "C", "room": "lab-demo"},
            "ts": utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
            "source": "home_assistant_demo"
          } | tojson }}

