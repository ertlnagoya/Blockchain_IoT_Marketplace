[project]
name = "iw3ip-ha-ssi-publisher"
version = "0.1.0"
description = "Home Assistant x SSI Consent VC Data Publisher prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "httpx>=0.28.0",
  "paho-mqtt>=2.1.0",
  "cryptography>=42",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
