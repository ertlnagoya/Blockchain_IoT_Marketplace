version: "3"
services:
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: ipfs_node
    ports:
      - "4001:4001"   # libp2p
      - "5001:5001"   # API
      - "8080:8080"   # Gateway
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs
    restart: unless-stopped

volumes:
  ipfs_staging:
  ipfs_data:
