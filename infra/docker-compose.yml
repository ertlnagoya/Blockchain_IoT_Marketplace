services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iw3ip-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  publisher:
    build:
      context: ..
      dockerfile: publisher/Dockerfile
    container_name: iw3ip-publisher
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_TOPICS: homeassistant/state/+/+,homeassistant/event/+
      PLATFORM_API_URL: http://publisher:8080/platform/ingest
      DEFAULT_PURPOSE: research
      PUBLISHER_ID: publisher-001
      AUDIT_DB_PATH: /data/audit.db
      CONSENT_STORE_PATH: /data/consents.json
    ports:
      - "8080:8080"
    volumes:
      - publisher_data:/data

  nodered:
    image: nodered/node-red:latest
    container_name: iw3ip-nodered
    profiles: ["nodered"]
    ports:
      - "1880:1880"
    depends_on:
      - mosquitto

volumes:
  publisher_data:
