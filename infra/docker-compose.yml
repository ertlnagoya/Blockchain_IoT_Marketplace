services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iw3ip-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  publisher:
    build:
      context: ..
      dockerfile: publisher/Dockerfile
    container_name: iw3ip-publisher
    depends_on:
      - mosquitto
    # Stage T (case C): when the `ipfs` compose profile is active, the
    # operator should bring kubo up alongside the publisher and set
    # IPFS_API_URL=http://ipfs:5001 / IPFS_GATEWAY_URL=http://ipfs:8080
    # via the .env file. depends_on intentionally stays soft so case
    # B-only deployments keep working without the kubo image.
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_TOPICS: homeassistant/state/+/+,homeassistant/event/+
      PLATFORM_API_URL: http://publisher:8080/platform/ingest
      DEFAULT_PURPOSE: research
      PUBLISHER_ID: publisher-001
      AUDIT_DB_PATH: /data/audit.db
      CONSENT_STORE_PATH: /data/consents.json
      # Stage T (case B): media gateway store + (optional) public base URL
      MEDIA_STORE_PATH: /data/media
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      # Stage T (case C): IPFS daemon endpoints. Activate with the
      # `ipfs` compose profile -- when the kubo container is up the
      # publisher mirrors every /media/upload into IPFS and proxies
      # /ipfs/<cid> to the daemon's HTTP gateway. When the profile is
      # off, both env vars stay empty and the gateway runs case B only.
      IPFS_API_URL: ${IPFS_API_URL:-}
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-}
      # Stage T (VLM extension): semantic-level tier projection.
      # Activate with the `vlm` compose profile -- when the env vars
      # below are non-empty the publisher generates description_full /
      # description_summary / image_url_redacted alongside the raw
      # upload and /platform/data ships them per the tier projection
      # in trust_score._level_to_views_vlm. When empty the publisher
      # runs the legacy 3-tier path (image/video keys drop per tier)
      # exactly as before, so existing tests and demos do not regress.
      # Backends:
      #   VLM_BACKEND in {"", "stub", "ollama"}
      #   IMAGE_REDACTION_BACKEND in {"", "stub", "opencv"}
      VLM_BACKEND: ${VLM_BACKEND:-}
      VLM_API_URL: ${VLM_API_URL:-}
      VLM_MODEL: ${VLM_MODEL:-llava}
      IMAGE_REDACTION_BACKEND: ${IMAGE_REDACTION_BACKEND:-}
      SSI_ISSUER_BASE_URL: ${SSI_ISSUER_BASE_URL:-http://publisher:8080}
      SSI_ISSUER_KEY_PATH: /data/issuer_key.jwk.json
      SSI_PEX_SIDECAR_URL: http://verifier-sidecar:7000
      SSI_PRESENTATION_DEFS_DIR: /app/examples/ssi_wallet
    ports:
      - "8080:8080"
    volumes:
      - publisher_data:/data

  verifier-sidecar:
    build:
      context: ../ssi/verifier-sidecar
      dockerfile: Dockerfile
    container_name: iw3ip-verifier-sidecar
    profiles: ["ssi-wallet"]
    environment:
      PORT: "7000"
    ports:
      - "7100:7000"

  nodered:
    image: nodered/node-red:latest
    container_name: iw3ip-nodered
    profiles: ["nodered"]
    ports:
      - "1880:1880"
    depends_on:
      - mosquitto

  bridge:
    build:
      context: ../bridge
      dockerfile: Dockerfile
    container_name: iw3ip-mv-bridge
    profiles: ["mv-bridge"]
    depends_on:
      - publisher
    environment:
      # Hardhat is expected to run on the host (`npx hardhat node`)
      # so the existing iot-market workflow stays unchanged.
      BRIDGE_HARDHAT_RPC: ${BRIDGE_HARDHAT_RPC:-http://host.docker.internal:8545}
      BRIDGE_IOT_MARKET_ADDRESS: ${BRIDGE_IOT_MARKET_ADDRESS:-}
      BRIDGE_PUBLISHER_URL: http://publisher:8080
      # Externally-reachable publisher URL the wallet uses (LAN IP).
      # Required so the OID4VCI offer baked by /marketplace/claim
      # surfaces a deeplink the phone can actually fetch.
      BRIDGE_PUBLIC_PUBLISHER_URL: ${BRIDGE_PUBLIC_PUBLISHER_URL:-http://host.docker.internal:8080}
      BRIDGE_DATASET_DEFAULT: ${BRIDGE_DATASET_DEFAULT:-home/env/temperature}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Stage T (case C) — local IPFS daemon (kubo). Activate with
  # `--profile ipfs`. The publisher mirrors every /media/upload into
  # this daemon (`/api/v0/add`) and reverse-proxies /ipfs/<cid> to the
  # daemon's HTTP gateway, so the wallet can dereference real
  # content-addressed URLs without internet access.
  ipfs:
    image: ipfs/kubo:release
    container_name: iw3ip-ipfs
    profiles: ["ipfs"]
    environment:
      # Bind both the API and gateway to all interfaces so the
      # publisher container can reach them inside the docker network.
      IPFS_PROFILE: server
    volumes:
      - ipfs_data:/data/ipfs
      - ipfs_export:/export
    # No host port-forward by default — the publisher proxies
    # everything via /ipfs/<cid>. Uncomment for ad-hoc CLI access:
    # ports:
    #   - "5001:5001"   # API
    #   - "8081:8080"   # gateway (8081 to avoid collision with publisher)

  # Stage T (VLM extension) — placeholder service for `--profile vlm`.
  # Δ2 (this PR): empty service definition exists so `docker compose
  # --profile vlm up` succeeds and the publisher's VLM_BACKEND env var
  # gets exercised end-to-end with the `stub` backend (no external
  # model needed for the architecture smoke test).
  # Δ3 (next PR): replace this with a real Ollama service that loads
  # `llava` and exposes /api/generate, then flip the publisher's
  # VLM_BACKEND default to `ollama` under the same profile.
  vlm:
    image: alpine:3.20
    container_name: iw3ip-vlm
    profiles: ["vlm"]
    command: ["sh", "-c", "echo 'vlm placeholder (Δ3 will replace with ollama+llava)'; sleep infinity"]

volumes:
  publisher_data:
  ipfs_data:
  ipfs_export:
