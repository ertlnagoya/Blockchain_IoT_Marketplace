services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iw3ip-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  publisher:
    build:
      context: ..
      dockerfile: publisher/Dockerfile
    container_name: iw3ip-publisher
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_TOPICS: homeassistant/state/+/+,homeassistant/event/+
      PLATFORM_API_URL: http://publisher:8080/platform/ingest
      DEFAULT_PURPOSE: research
      PUBLISHER_ID: publisher-001
      AUDIT_DB_PATH: /data/audit.db
      CONSENT_STORE_PATH: /data/consents.json
    ports:
      - "8080:8080"
    volumes:
      - publisher_data:/data

  assistant:
    build:
      context: ..
      dockerfile: assistant/Dockerfile
    container_name: iw3ip-assistant
    profiles: ["assistant"]
    environment:
      ASSISTANT_SAMPLE_EVENTS_PATH: examples/phase3_events_park_safety.json
      ASSISTANT_PLANNER_MODE: rule_based
      ASSISTANT_PLANNER_NAME: rule-based-planner-v1
      ASSISTANT_LLM_PROVIDER: stub
      ASSISTANT_LLM_API_BASE_URL: ""
      ASSISTANT_LLM_API_KEY: ""
      ASSISTANT_LLM_MODEL: ""
      ASSISTANT_LLM_TIMEOUT_SECONDS: 20
    ports:
      - "8090:8090"

  assistant-llm:
    build:
      context: ..
      dockerfile: assistant/Dockerfile
    container_name: iw3ip-assistant-llm
    profiles: ["assistant-llm"]
    env_file:
      - ../.env.local
    environment:
      ASSISTANT_SAMPLE_EVENTS_PATH: examples/phase3_events_park_safety.json
    ports:
      - "8090:8090"

  nodered:
    image: nodered/node-red:latest
    container_name: iw3ip-nodered
    profiles: ["nodered"]
    ports:
      - "1880:1880"
    depends_on:
      - mosquitto

volumes:
  publisher_data:
