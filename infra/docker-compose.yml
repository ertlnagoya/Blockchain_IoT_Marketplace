services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iw3ip-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  publisher:
    build:
      context: ..
      dockerfile: publisher/Dockerfile
    container_name: iw3ip-publisher
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_TOPICS: homeassistant/state/+/+,homeassistant/event/+
      PLATFORM_API_URL: http://publisher:8080/platform/ingest
      DEFAULT_PURPOSE: research
      PUBLISHER_ID: publisher-001
      AUDIT_DB_PATH: /data/audit.db
      CONSENT_STORE_PATH: /data/consents.json
      SSI_ISSUER_BASE_URL: ${SSI_ISSUER_BASE_URL:-http://publisher:8080}
      SSI_ISSUER_KEY_PATH: /data/issuer_key.jwk.json
      SSI_PEX_SIDECAR_URL: http://verifier-sidecar:7000
      SSI_PRESENTATION_DEFS_DIR: /app/examples/ssi_wallet
    ports:
      - "8080:8080"
    volumes:
      - publisher_data:/data

  verifier-sidecar:
    build:
      context: ../ssi/verifier-sidecar
      dockerfile: Dockerfile
    container_name: iw3ip-verifier-sidecar
    profiles: ["ssi-wallet"]
    environment:
      PORT: "7000"
    ports:
      - "7100:7000"

  nodered:
    image: nodered/node-red:latest
    container_name: iw3ip-nodered
    profiles: ["nodered"]
    ports:
      - "1880:1880"
    depends_on:
      - mosquitto

  bridge:
    build:
      context: ../bridge
      dockerfile: Dockerfile
    container_name: iw3ip-mv-bridge
    profiles: ["mv-bridge"]
    depends_on:
      - publisher
    environment:
      # Hardhat is expected to run on the host (`npx hardhat node`)
      # so the existing iot-market workflow stays unchanged.
      BRIDGE_HARDHAT_RPC: ${BRIDGE_HARDHAT_RPC:-http://host.docker.internal:8545}
      BRIDGE_IOT_MARKET_ADDRESS: ${BRIDGE_IOT_MARKET_ADDRESS:-}
      BRIDGE_PUBLISHER_URL: http://publisher:8080
      BRIDGE_DATASET_DEFAULT: ${BRIDGE_DATASET_DEFAULT:-home/env/temperature}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  publisher_data:
